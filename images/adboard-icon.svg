<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ad Board">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16BD8B"/>
      <stop offset="1" stop-color="#0B8F73"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#043B2E" flood-opacity="0.28"/>
    </filter>
    <filter id="pinShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7A3E00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- subtle top sheen -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="#FFFFFF" opacity="0.06"/>

  <!-- Pinned note card (rotated slightly, hanging from the pin at 256,150) -->
  <g transform="rotate(-6 256 150)" filter="url(#cardShadow)">
    <rect x="128" y="150" width="256" height="256" rx="22" fill="#FFFFFF"/>
    <!-- image placeholder -->
    <rect x="156" y="182" width="200" height="112" rx="12" fill="#CFF3E4"/>
    <circle cx="196" cy="222" r="15" fill="#34D399"/>
    <path d="M164 294 L214 244 L252 282 L286 250 L348 294 Z" fill="#10B981"/>
    <!-- text lines -->
    <rect x="156" y="316" width="150" height="20" rx="10" fill="#94A3B8"/>
    <rect x="156" y="348" width="200" height="15" rx="7.5" fill="#CBD5E1"/>
    <rect x="156" y="374" width="150" height="15" rx="7.5" fill="#CBD5E1"/>
  </g>

  <!-- Pushpin sitting on top of the card -->
  <g filter="url(#pinShadow)">
    <circle cx="256" cy="150" r="26" fill="url(#pin)"/>
    <circle cx="256" cy="150" r="26" fill="none" stroke="#D97706" stroke-width="2" opacity="0.7"/>
    <circle cx="248" cy="142" r="8" fill="#FFFFFF" opacity="0.75"/>
  </g>
</svg>
