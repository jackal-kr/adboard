PLG_FINDER_ADBOARD="Smart Search - Tablica Ogłoszeń"
PLG_FINDER_ADBOARD_XML_DESCRIPTION="Integruje komponent <strong>Tablica Ogłoszeń</strong> (<code>com_adboard</code>) z silnikiem Smart Search Joomla (<code>com_finder</code>), umożliwiając pełnotekstowe przeszukiwanie opublikowanych ogłoszeń na stronie.<br><br><strong>Co jest indeksowane</strong><br>Każde opublikowane, niewyprze ogłoszenie jest indeksowane wraz z tytułem, kategorią, opisem i danymi kontaktowymi. Wygasłe (state&nbsp;=&nbsp;2) oraz cofnięte i odrzucone ogłoszenia są automatycznie usuwane z indeksu.<br><br><strong>Jak używać</strong><br>1. Włącz tę wtyczkę (zielony przełącznik).<br>2. Przejdź do <strong>Komponenty &rarr; Smart Search</strong> i kliknij <strong>Indeksuj</strong>, aby wykonać pełne indeksowanie początkowe.<br>3. Od tej chwili indeks jest aktualizowany automatycznie: nowe ogłoszenia są dodawane po opublikowaniu, usuwane po wygaśnięciu lub odrzuceniu.<br>4. Odwiedzający mogą szukać ogłoszeń za pomocą modułu Smart Search lub strony Zaawansowanego Wyszukiwania &mdash; w filtrze typów pojawi się pozycja <em>Ogłoszenia</em>.<br><br><strong>Czyszczenie indeksu</strong><br>Wtyczka nadpisuje <code>onFinderGarbageCollection</code>, aby podczas planowanej konserwacji usuwać wygasłe i nieopublikowane wpisy z indeksu wyszukiwania."
