PLG_FINDER_ADBOARD="Smart Search - Ad Board"
PLG_FINDER_ADBOARD_XML_DESCRIPTION="Integrates the <strong>Ad Board</strong> component (<code>com_adboard</code>) with Joomla's Smart Search engine (<code>com_finder</code>), making published advertisements full-text searchable across the site.<br><br><strong>What it indexes</strong><br>Each published, non-expired advertisement is indexed with its title, category, description, and contact information. Expired ads (state&nbsp;=&nbsp;2) and unpublished / rejected ads are automatically removed from the index.<br><br><strong>How to use</strong><br>1. Enable this plugin (green toggle).<br>2. Go to <strong>Components &rarr; Smart Search</strong> and click <strong>Index</strong> to perform a full initial index.<br>3. From that point on, the index is kept up to date automatically: new ads are added when published, removed when they expire or are rejected.<br>4. Visitors can search for ads using the site's Smart Search module or the Advanced Search page &mdash; the content type <em>Advertisements</em> will appear in the type filter.<br><br><strong>Garbage collection</strong><br>The plugin overrides <code>onFinderGarbageCollection</code> to purge expired and unpublished ad entries from the search index during scheduled maintenance, keeping search results clean without manual intervention."
