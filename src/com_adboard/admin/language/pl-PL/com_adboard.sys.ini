COM_ADBOARD="Tablica Ogłoszeń"
COM_ADBOARD_XML_DESCRIPTION="Moderowana tablica ogłoszeń dla Joomla, przeznaczona dla stowarzyszeń ogrodów działkowych i małych społeczności.<br><br><strong>Dla odwiedzających</strong><br>Każdy może dodać ogłoszenie (działka na sprzedaż, wymiana roślin, narzędzia, usługi) przez publiczny formularz &mdash; bez konieczności posiadania konta. Zgłoszenia trafiają do kolejki moderacji i pojawiają się publicznie dopiero po zatwierdzeniu przez administratora.<br><br><strong>Dla moderatorów</strong><br>Panel administracyjny wyświetla wszystkie ogłoszenia z ich aktualnym stanem: <em>Oczekujące</em>, <em>Opublikowane</em>, <em>Wygasłe</em>, <em>Odrzucone</em> lub <em>W koszu</em>. Moderatorzy mogą zatwierdzać, cofać, odrzucać lub usuwać ogłoszenia pojedynczo lub zbiorczo. Wszystkie działania są rejestrowane w <strong>Logach Akcji Joomla</strong> (Pulpit &rarr; Ostatnie Akcje).<br><br><strong>Główne funkcje</strong><br>&bull; Przesyłanie zdjęć z re-enkodowaniem GD, usuwaniem EXIF, przeciągnij-i-upuść, podgląd pełnoekranowy<br>&bull; Konfigurowalne okresy aktywności ogłoszenia (7 / 14 / 21 / 30 dni lub własne)<br>&bull; Limit zgłoszeń per IP + honeypot + obsługa CAPTCHA<br>&bull; Powiadomienie e-mail do moderatora przy nowym zgłoszeniu<br>&bull; Integracja Smart Search przez wtyczkę finder<br>&bull; Pełna obsługa ACL Joomla z obsługą moderacji na poziomie Managera<br><br><strong>Konfiguracja</strong><br>Otwórz <strong>Komponenty &rarr; Tablica Ogłoszeń &rarr; Opcje</strong>, aby skonfigurować kategorie, okresy aktywności, limity zdjęć, limity zgłoszeń i powiadomienia e-mail. Wymaga uprawnienia <code>core.admin</code>."

