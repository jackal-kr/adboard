COM_ADBOARD="Ad Board"
COM_ADBOARD_XML_DESCRIPTION="Moderated classifieds board for Joomla, designed for garden plot associations and small communities.<br><br><strong>For site visitors</strong><br>Anyone can submit an advertisement (plot for sale, plant exchange, tools, services) via a public form &mdash; no account required. Submissions go into a moderation queue and appear publicly only after an administrator approves them.<br><br><strong>For moderators</strong><br>The admin panel lists all ads with their current state: <em>Pending</em> (awaiting review), <em>Published</em>, <em>Expired</em>, <em>Rejected</em>, or <em>Trashed</em>. Moderators can approve, unpublish, reject, or delete ads individually or in bulk. All actions are recorded in <strong>Joomla Action Logs</strong> (Home Dashboard &rarr; Latest Actions).<br><br><strong>Key features</strong><br>&bull; Image upload with GD re-encode, EXIF stripping, drag-to-reorder, lightbox viewer<br>&bull; Configurable expiry terms (7 / 14 / 21 / 30 days, or custom)<br>&bull; IP-based rate limiting + honeypot + CAPTCHA support<br>&bull; Email notification to moderator on new submission<br>&bull; Smart Search integration via the companion finder plugin<br>&bull; Full Joomla ACL with Manager-level moderation support<br><br><strong>Configuration</strong><br>Open <strong>Components &rarr; Ad Board &rarr; Options</strong> to configure categories, expiry terms, image limits, rate limiting, and email notifications. Requires <code>core.admin</code> permission."

