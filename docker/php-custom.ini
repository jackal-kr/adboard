; php-custom.ini — mounted into the Joomla container
; Path in container: /usr/local/etc/php/conf.d/99-custom.ini
; Edit values here; container reads them on next restart.

[PHP]
memory_limit          = 256M
upload_max_filesize   = 64M
post_max_size         = 64M
max_execution_time    = 120
max_input_time        = 120
max_input_vars        = 3000
default_charset       = UTF-8

; Development helpers — set to Off for staging/production
display_errors        = On
display_startup_errors = On
error_reporting       = E_ALL
log_errors            = On

; Session
session.gc_maxlifetime = 3600
