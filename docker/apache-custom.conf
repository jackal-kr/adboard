# apache-custom.conf — mounted into the Joomla container
# Path in container: /etc/apache2/conf-enabled/99-custom.conf

# Increase timeouts for long Joomla admin operations
Timeout 300
KeepAliveTimeout 15

# Allow .htaccess overrides (required by Joomla's SEF URLs)
<Directory /var/www/html>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Hide server version info
ServerTokens Prod
ServerSignature Off
