; 99-xdebug.ini — Xdebug settings for the Joomla dev container.
; The extension itself is loaded by docker-php-ext-enable; this is config only.

xdebug.mode            = debug
; "trigger" = only start a debug session when explicitly asked (a cookie/GET
; param from a browser toggle, or ?XDEBUG_TRIGGER=1). Keeps normal page loads
; fast. Change to "yes" to debug every request.
xdebug.start_with_request = trigger

; host.docker.internal points back at your host (VS Code). On Linux this needs
; the extra_hosts mapping in compose.yml (host-gateway).
xdebug.client_host     = host.docker.internal
xdebug.client_port     = 9003

xdebug.log             = /tmp/xdebug.log
xdebug.log_level       = 7
